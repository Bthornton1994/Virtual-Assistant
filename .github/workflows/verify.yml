name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pr67-live-qa:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 67
    needs: verify
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qbvmtgaphvpwpwemplje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Tl55fEkqLrElRf2O4j_Z6g_Vpi6qi6y
      QA_TWL_RUN_ID: c0607157-e9a9-4887-b17b-d8a34934f864
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/twl-prepare-proof-live.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr67-live-qa
          path: test-results/
          if-no-files-found: ignore
