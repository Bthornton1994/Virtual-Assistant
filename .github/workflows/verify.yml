name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Deterministic agent reliability gate (no model/network/prod DB).
      # Fails on security/authority/tenant/approval/evidence/prepare-only regressions.
      - run: npm run eval:agent
      # Runtime-backed synthetic evaluation (real contracts, no model/network/prod DB).
      - run: npm run eval:agent:runtime
      - run: npm run build
